<style>
:root{
  --paper:#F0EEE7;
  --surface:#FFFFFF;
  --ink:#1B1D21;
  --ink-muted:#63676F;
  --ink-faint:#9A9C9F;
  --line:#DBD8CE;
  --accent:#3E6E91;
  --accent-ink:#FFFFFF;
  --success:#4F8F5E;
  --success-bg:#E5F0E6;
  --warning:#C97A2B;
  --warning-bg:#F7E9D6;
  --danger:#B8503D;
  --danger-bg:#F6E1DC;
  --stripe-idle:#C9C6BB;
  --font-display:-apple-system,"Helvetica Neue",Helvetica,Arial,sans-serif;
  --font-body:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --font-mono:ui-monospace,"SF Mono","Roboto Mono","Cascadia Mono",Menlo,Consolas,monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root{
    --paper:#14161A;
    --surface:#1D2025;
    --ink:#ECEAE3;
    --ink-muted:#9A9CA3;
    --ink-faint:#6B6E74;
    --line:#2C2F35;
    --accent:#6FA8CC;
    --accent-ink:#0E1013;
    --success:#6FBE81;
    --success-bg:#1E2A20;
    --warning:#E1974C;
    --warning-bg:#33270F;
    --danger:#E07862;
    --danger-bg:#331E19;
    --stripe-idle:#3A3D43;
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --paper:#14161A;--surface:#1D2025;--ink:#ECEAE3;--ink-muted:#9A9CA3;--ink-faint:#6B6E74;
  --line:#2C2F35;--accent:#6FA8CC;--accent-ink:#0E1013;--success:#6FBE81;--success-bg:#1E2A20;
  --warning:#E1974C;--warning-bg:#33270F;--danger:#E07862;--danger-bg:#331E19;--stripe-idle:#3A3D43;
  color-scheme: dark;
}
:root[data-theme="light"]{
  --paper:#F0EEE7;--surface:#FFFFFF;--ink:#1B1D21;--ink-muted:#63676F;--ink-faint:#9A9C9F;
  --line:#DBD8CE;--accent:#3E6E91;--accent-ink:#FFFFFF;--success:#4F8F5E;--success-bg:#E5F0E6;
  --warning:#C97A2B;--warning-bg:#F7E9D6;--danger:#B8503D;--danger-bg:#F6E1DC;--stripe-idle:#C9C6BB;
  color-scheme: light;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--paper);
  color:var(--ink);
  font-family:var(--font-body);
  font-size:16px;
  line-height:1.45;
  -webkit-font-smoothing:antialiased;
  overscroll-behavior-y:none;
}
#app{
  max-width:560px;
  margin:0 auto;
  padding:20px 16px 96px;
  min-height:100vh;
}
h1,h2,h3{font-family:var(--font-display);text-wrap:balance;margin:0;}
.eyebrow{
  font-family:var(--font-mono);
  font-size:11px;
  letter-spacing:.11em;
  text-transform:uppercase;
  color:var(--ink-faint);
}
.page-title{
  font-size:26px;
  font-weight:800;
  letter-spacing:-0.01em;
  margin-top:2px;
}
.subtitle{color:var(--ink-muted);font-size:14.5px;margin-top:4px;}
.num{font-family:var(--font-mono);font-variant-numeric:tabular-nums;}

/* ---- top bar ---- */
.topbar{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:18px;}
.brand{font-family:var(--font-display);font-weight:900;letter-spacing:.02em;font-size:15px;}

/* ---- day cards ---- */
.day-list{display:flex;flex-direction:column;gap:10px;margin-top:16px;}
.day-card{
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:10px;
  border-left:5px solid var(--accent);
  overflow:hidden;
}
.day-main{
  background:none;
  border:none;
  padding:16px 16px 16px 14px;
  display:flex;
  align-items:center;
  gap:14px;
  text-align:left;
  width:100%;
  cursor:pointer;
  transition:transform .1s ease;
  color:inherit;
  font:inherit;
}
.day-main:active{transform:scale(.99);}
.day-main .idx{
  font-family:var(--font-mono);
  font-size:22px;
  font-weight:700;
  color:var(--ink-faint);
  min-width:28px;
}
.day-main .meta{flex:1;min-width:0;}
.day-main .dname{font-weight:700;font-size:16px;}
.day-main .dgroups{color:var(--ink-muted);font-size:13.5px;margin-top:2px;}
.day-main .dlast{font-family:var(--font-mono);font-size:11.5px;color:var(--ink-faint);margin-top:6px;letter-spacing:.02em;}
.day-main .dskip{font-family:var(--font-mono);font-size:11.5px;color:var(--warning);margin-top:3px;letter-spacing:.02em;}
.day-main .go{color:var(--accent);font-size:20px;}
.day-skip{
  display:block;
  width:100%;
  background:none;
  border:none;
  border-top:1px solid var(--line);
  padding:9px 14px;
  font-family:var(--font-body);
  font-size:12.5px;
  font-weight:600;
  color:var(--ink-muted);
  text-align:left;
  cursor:pointer;
}
.day-skip:active{background:var(--paper);}
.resume-banner{
  background:var(--warning-bg);
  border:1px solid var(--warning);
  color:var(--ink);
  border-radius:10px;
  padding:12px 14px;
  font-size:14px;
  margin-bottom:14px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
}
.resume-banner strong{display:block;font-size:14.5px;}
.backup-banner{
  background:var(--surface);border:1px solid var(--line);border-radius:10px;
  padding:12px 14px;font-size:13.5px;color:var(--ink-muted);margin-bottom:14px;
  display:flex;justify-content:space-between;align-items:center;gap:10px;
}
.backup-banner strong{color:var(--ink);}
.backup-status{font-weight:700;font-size:14px;}
.backup-status.warn{color:var(--warning);}

/* ---- buttons ---- */
.btn{
  font-family:var(--font-body);
  font-weight:700;
  font-size:14.5px;
  border-radius:8px;
  border:1px solid var(--line);
  background:var(--surface);
  color:var(--ink);
  padding:11px 16px;
  cursor:pointer;
}
.btn-primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);}
.btn-ghost{background:transparent;border-color:transparent;color:var(--accent);padding-left:0;padding-right:0;}
.btn-danger{color:var(--danger);}
.btn-block{width:100%;}
.btn:focus-visible,input:focus-visible,textarea:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
.btn-row{display:flex;gap:10px;margin-top:18px;}

/* ---- tab bar ---- */
.tabbar{
  position:fixed;
  bottom:0;left:0;right:0;
  background:var(--surface);
  border-top:1px solid var(--line);
  display:flex;
  padding-bottom:env(safe-area-inset-bottom);
  z-index:20;
}
.tabbar button{
  flex:1;
  background:none;
  border:none;
  padding:10px 4px 8px;
  font-family:var(--font-body);
  font-size:11px;
  font-weight:600;
  letter-spacing:.02em;
  color:var(--ink-faint);
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:3px;
  cursor:pointer;
}
.tabbar button .ic{font-size:19px;}
.tabbar button.active{color:var(--accent);}

/* ---- session / exercise cards ---- */
.session-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:14px;}
.ex-card{
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:10px;
  margin-bottom:12px;
  overflow:hidden;
  border-left:5px solid var(--stripe-idle);
}
.ex-card.state-progress{border-left-color:var(--accent);}
.ex-card.state-done{border-left-color:var(--success);}
.ex-card.state-sub{border-left-color:var(--warning);}
.ex-body{padding:14px 14px 12px;}
.ex-head{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;}
.ex-name{font-weight:700;font-size:15px;line-height:1.3;}
.ex-group{font-family:var(--font-mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-faint);margin-top:2px;}
.ex-note{font-size:12.5px;color:var(--ink-muted);font-style:italic;margin-top:4px;}
.flag-chip{
  background:var(--warning-bg);
  color:var(--warning);
  font-family:var(--font-mono);
  font-size:11px;
  font-weight:700;
  padding:4px 8px;
  border-radius:20px;
  white-space:nowrap;
  letter-spacing:.01em;
}
.sub-toggle{background:none;border:none;color:var(--accent);font-size:12.5px;font-weight:600;padding:0;cursor:pointer;margin-top:8px;}
.set-group{margin-top:12px;}
.set-group-label{font-family:var(--font-mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-faint);margin-bottom:6px;}
.set-row{display:grid;grid-template-columns:34px 1fr 1fr;gap:8px;align-items:center;margin-bottom:6px;}
.set-row .slabel{font-family:var(--font-mono);font-size:12px;color:var(--ink-faint);}
.set-field{position:relative;}
.set-field input{
  width:100%;
  border:1px solid var(--line);
  background:var(--paper);
  color:var(--ink);
  border-radius:7px;
  padding:9px 8px 9px 8px;
  font-family:var(--font-mono);
  font-variant-numeric:tabular-nums;
  font-size:14.5px;
}
.set-field .unit{position:absolute;right:8px;top:9px;font-size:11px;color:var(--ink-faint);pointer-events:none;font-family:var(--font-mono);}
.set-hint{font-family:var(--font-mono);font-size:10.5px;color:var(--ink-faint);margin-top:2px;}
.daily-input{position:relative;max-width:200px;}
.daily-input input{
  width:100%;border:1px solid var(--line);background:var(--paper);color:var(--ink);
  border-radius:7px;padding:11px 40px 11px 12px;font-family:var(--font-mono);
  font-variant-numeric:tabular-nums;font-size:16px;
}
.daily-input .unit{position:absolute;right:12px;top:50%;transform:translateY(-50%);font-size:12px;color:var(--ink-faint);pointer-events:none;font-family:var(--font-mono);}
.daily-select{
  width:100%;max-width:200px;border:1px solid var(--line);background:var(--paper);color:var(--ink);
  border-radius:7px;padding:11px 12px;font-family:var(--font-body);font-size:16px;
}
.saved-check{font-size:12.5px;font-weight:600;color:var(--success);margin-top:10px;text-align:center;}
.check-row{display:flex;align-items:center;gap:9px;margin-top:10px;}
.check-row input{width:19px;height:19px;accent-color:var(--success);}
.sub-box{margin-top:10px;}
.sub-box textarea{
  width:100%;
  min-height:64px;
  border:1px solid var(--line);
  background:var(--paper);
  color:var(--ink);
  border-radius:7px;
  padding:9px 10px;
  font-family:var(--font-body);
  font-size:14px;
  resize:vertical;
}
.sub-box label{font-size:12.5px;color:var(--ink-muted);display:block;margin-bottom:5px;}
.reserve-chips{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:8px;}
.reserve-chip{
  border:1px solid var(--line);background:var(--paper);color:var(--ink);
  border-radius:20px;padding:7px 12px;font-family:var(--font-body);font-size:13px;font-weight:600;cursor:pointer;
}
.reserve-chip.active{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);}

/* ---- summary ---- */
.summary-hero{
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:12px;
  padding:18px;
  margin-bottom:16px;
}
.summary-hero p{margin:0;font-size:15px;line-height:1.55;}
.duration-badge{
  display:inline-block;font-family:var(--font-mono);font-weight:700;font-size:12.5px;
  background:var(--paper);color:var(--ink-muted);padding:5px 10px;border-radius:20px;margin-bottom:12px;
}
.summary-stats{display:flex;gap:16px;margin-top:14px;}
.stat{flex:1;}
.stat .n{font-family:var(--font-mono);font-size:24px;font-weight:700;font-variant-numeric:tabular-nums;}
.stat .l{font-size:11.5px;color:var(--ink-muted);margin-top:1px;}
.stat.up .n{color:var(--success);}
.stat.down .n{color:var(--danger);}
.section-label{font-family:var(--font-mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-faint);margin:20px 0 8px;}
.flag-card{
  background:var(--warning-bg);
  border:1px solid var(--warning);
  border-radius:10px;
  padding:12px 14px;
  margin-bottom:8px;
}
.flag-card .t{font-weight:700;font-size:14px;}
.flag-card .d{font-size:13px;color:var(--ink-muted);margin-top:2px;}
.insight-card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:8px;}
.insight-card.warn{background:var(--warning-bg);border-color:var(--warning);}
.insight-card.action{background:var(--success-bg);border-color:var(--success);}
.insight-card .t{font-weight:700;font-size:14px;}
.insight-card .d{font-size:13px;color:var(--ink-muted);margin-top:2px;line-height:1.5;}
.delta-row{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:10px 0;
  border-bottom:1px solid var(--line);
  gap:10px;
}
.delta-row:last-child{border-bottom:none;}
.delta-row .en{font-size:14px;font-weight:600;flex:1;min-width:0;}
.delta-row .ev{font-family:var(--font-mono);font-size:12.5px;color:var(--ink-muted);text-align:right;white-space:nowrap;}
.delta-row .ev b{color:var(--success);}
.delta-row .ev.neg b{color:var(--danger);}
.sub-row{padding:10px 0;border-bottom:1px solid var(--line);}
.sub-row:last-child{border-bottom:none;}
.sub-row .en{font-size:14px;font-weight:600;}
.sub-row .ev{font-size:13px;color:var(--ink-muted);margin-top:3px;}
.pill{display:inline-block;font-family:var(--font-mono);font-size:10px;padding:2px 7px;border-radius:20px;margin-left:6px;}
.pill-new{background:var(--accent);color:var(--accent-ink);}

/* ---- history ---- */
.hist-item{
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:10px;
  padding:13px 14px;
  margin-bottom:9px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  cursor:pointer;
}
.hist-item.skipped{border-left:3px solid var(--warning);}
.hist-item .hd{font-weight:700;font-size:14.5px;}
.hist-item .hs{font-size:12.5px;color:var(--ink-muted);margin-top:2px;}
.hist-item .hflag{
  font-family:var(--font-mono);font-size:10px;font-weight:700;letter-spacing:.03em;
  color:var(--warning);background:var(--warning-bg);padding:3px 8px;border-radius:20px;white-space:nowrap;
}
.week-section-label{
  font-family:var(--font-mono);font-size:11.5px;font-weight:700;letter-spacing:.06em;
  color:var(--ink);margin:22px 0 8px;
}
.week-section-label:first-child{margin-top:0;}
.daily-row{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);}
.daily-row:last-child{border-bottom:none;}
.daily-row .dd{font-family:var(--font-mono);font-size:12px;color:var(--ink-faint);white-space:nowrap;}
.daily-row .dv{font-family:var(--font-mono);font-size:12.5px;color:var(--ink-muted);text-align:right;}
.empty-state{color:var(--ink-muted);font-size:14px;padding:30px 8px;text-align:center;}

/* ---- settings ---- */
.field{margin-bottom:16px;}
.field label{display:block;font-size:13.5px;font-weight:600;margin-bottom:6px;}
.help{font-size:12.5px;color:var(--ink-muted);margin-top:4px;}
.field input[type=number]{
  border:1px solid var(--line);background:var(--surface);color:var(--ink);
  border-radius:7px;padding:9px 10px;font-family:var(--font-mono);font-size:15px;width:110px;
}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:14px;}
.segmented{display:flex;background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:3px;gap:3px;}
.segmented button{
  flex:1;border:none;background:none;border-radius:6px;padding:8px 4px;
  font-family:var(--font-body);font-size:13px;font-weight:600;color:var(--ink-muted);cursor:pointer;
}
.segmented button.active{background:var(--accent);color:var(--accent-ink);}
.reserve-group{margin-bottom:10px;}
.reserve-group .g{font-weight:700;font-size:13px;margin-bottom:3px;}
.reserve-group ul{margin:0;padding-left:18px;color:var(--ink-muted);font-size:13.5px;}
.linkrow{display:flex;gap:10px;}
.back-link{color:var(--accent);background:none;border:none;font-size:14px;font-weight:600;padding:0;cursor:pointer;margin-bottom:12px;display:inline-flex;align-items:center;gap:4px;}
a.filebtn{display:inline-block;}
input[type=file]{display:none;}

.modal-overlay{
  position:fixed;inset:0;background:rgba(0,0,0,.5);
  display:flex;align-items:center;justify-content:center;
  padding:20px;z-index:50;
}
.modal-box{
  background:var(--surface);border:1px solid var(--line);border-radius:12px;
  padding:20px;max-width:340px;width:100%;
}
.modal-box p{margin:0 0 18px;font-size:14.5px;line-height:1.5;color:var(--ink);}
.modal-btns{display:flex;gap:10px;}
.modal-btns .btn{flex:1;}

@media (prefers-reduced-motion: reduce){
  *{transition:none !important;animation:none !important;}
}
</style>

var MONTHS_ABBR = ["ian","feb","mar","apr","mai","iun","iul","aug","sep","oct","noi","dec"];
var MONTHS_FULL = ["ianuarie","februarie","martie","aprilie","mai","iunie","iulie","august","septembrie","octombrie","noiembrie","decembrie"];
function fmtDate(iso){
  var d = new Date(iso);
  return d.getDate()+" "+MONTHS_ABBR[d.getMonth()]+" "+d.getFullYear();
}
function todayIso(){ return new Date().toISOString(); }

function weekStart(d){
  var date = new Date(d.getFullYear(), d.getMonth(), d.getDate());
  var day = date.getDay();
  var diff = (day===0 ? -6 : 1) - day;
  date.setDate(date.getDate()+diff);
  return date;
}
function weekLabel(startDate){
  var end = new Date(startDate); end.setDate(end.getDate()+6);
  var sameMonth = startDate.getMonth()===end.getMonth() && startDate.getFullYear()===end.getFullYear();
  var sameYear = startDate.getFullYear()===end.getFullYear();
  if(sameMonth){
    return startDate.getDate()+" – "+end.getDate()+" "+MONTHS_FULL[end.getMonth()]+" "+end.getFullYear();
  } else if(sameYear){
    return startDate.getDate()+" "+MONTHS_FULL[startDate.getMonth()]+" – "+end.getDate()+" "+MONTHS_FULL[end.getMonth()]+" "+end.getFullYear();
  }
  return startDate.getDate()+" "+MONTHS_FULL[startDate.getMonth()]+" "+startDate.getFullYear()+" – "+end.getDate()+" "+MONTHS_FULL[end.getMonth()]+" "+end.getFullYear();
}
function weekKey(iso){ return weekStart(new Date(iso)).getTime(); }
function daysSince(iso){
  if(!iso) return null;
  return Math.floor((Date.now() - new Date(iso).getTime())/(24*3600*1000));
}

function touch(){ state.lastModifiedAt = todayIso(); }
function hasUnbackedChanges(){
  if(!state.lastModifiedAt) return false;
  var lastBackup = state.settings.lastBackupAt ? new Date(state.settings.lastBackupAt) : null;
  return !lastBackup || new Date(state.lastModifiedAt) > lastBackup;
}

function dateKey(d){
  d = d || new Date();
  var m = String(d.getMonth()+1).padStart(2,"0"), day = String(d.getDate()).padStart(2,"0");
  return d.getFullYear()+"-"+m+"-"+day;
}
function parseDateKey(dk){
  var p = dk.split("-");
  return new Date(parseInt(p[0],10), parseInt(p[1],10)-1, parseInt(p[2],10));
}
function fmtDateFull(d){
  return d.getDate()+" "+MONTHS_FULL[d.getMonth()]+" "+d.getFullYear();
}
function fmtDayMonth(d){
  return d.getDate()+" "+MONTHS_ABBR[d.getMonth()];
}
function emptyDailyLog(){ return {weight:"", sleepHours:"", protein:""}; }
function getDailyLog(dk){ return state.dailyLogs[dk] || emptyDailyLog(); }

function emptyEntryFor(exId){
  var ex = EXERCISES[exId];
  if(!ex.hasSets) return {done:false, substituted:false, substituteText:""};
  return {sets:[{weight:"",reps:""},{weight:"",reps:""},{weight:"",reps:""},{weight:"",reps:""}], substituted:false, substituteText:""};
}

function startDay(dayId){
  if(state.draft && state.draft.dayId !== dayId){
    askConfirm("Ai deja un antrenament neterminat ("+dayById[state.draft.dayId].name+"). Îl abandonezi și începi "+dayById[dayId].name+"?", function(){
      state.draft = null;
      beginDay(dayId);
    });
    return;
  }
  beginDay(dayId);
}

function beginDay(dayId){
  if(!state.draft){
    var entries = {};
    dayById[dayId].order.forEach(function(exId){ if(!entries[exId]) entries[exId] = emptyEntryFor(exId); });
    state.draft = {dayId:dayId, date: todayIso(), entries: entries};
    saveState();
  }
  view = "session";
  render();
}

function entryHasData(ex, e){
  if(!e || e.substituted) return false;
  if(!ex.hasSets) return !!e.done;
  return e.sets.some(function(st){ return st.weight!=="" && st.reps!==""; });
}

function reservesForGroup(group){
  return Object.keys(EXERCISES).filter(function(id){
    return EXERCISES[id].reserve && EXERCISES[id].group===group;
  }).map(function(id){ return {id:id, name:EXERCISES[id].name}; });
}

function lastEntryFor(exId, excludeSessionId){
  var ex = EXERCISES[exId];
  var best = null;
  for(var i=0;i<state.sessions.length;i++){
    var s = state.sessions[i];
    if(excludeSessionId && s.id===excludeSessionId) continue;
    var e = s.entries[exId];
    if(entryHasData(ex, e) && (best===null || new Date(s.date) > new Date(best.date))){
      best = {date:s.date, entry:e};
    }
  }
  return best;
}

function exState(exId){
  var e = state.draft.entries[exId];
  var ex = EXERCISES[exId];
  if(e.substituted) return "sub";
  if(!ex.hasSets) return e.done ? "done" : "idle";
  var filled = e.sets.filter(function(s){ return s.weight!=="" && s.reps!==""; }).length;
  if(filled===0) return "idle";
  if(filled===4) return "done";
  return "progress";
}

function setStreakFlagged(exId){
  var st = state.streaks[exId];
  return st && st.flagged;
}

function computeSummaryAndSave(){
  var draft = state.draft;
  var d = dayById[draft.dayId];
  var settings = state.settings;
  var sessionId = "s_"+Date.now();
  var results = []; // {exId, name, kind, ...}
  var subs = [];
  var improved=0, same=0, declined=0, newCount=0;
  var newFlags = [];

  d.order.forEach(function(exId){
    var ex = EXERCISES[exId];
    var entry = draft.entries[exId];
    if(entry.substituted){
      subs.push({exId:exId, name:ex.name, text:entry.substituteText||"(fără detalii)"});
      return;
    }
    if(!ex.hasSets){
      return; // no comparison for checkbox-only exercises
    }
    var filled = entry.sets.some(function(s){ return s.weight!=="" && s.reps!==""; });
    if(!filled) return;

    var prev = lastEntryFor(exId, null);
    var vol = entry.sets.reduce(function(sum,s){ var w=parseFloat(s.weight), r=parseFloat(s.reps); return sum + (isFinite(w)&&isFinite(r) ? w*r : 0); },0);
    var prevVol = prev ? prev.entry.sets.reduce(function(sum,s){ var w=parseFloat(s.weight), r=parseFloat(s.reps); return sum + (isFinite(w)&&isFinite(r) ? w*r : 0); },0) : null;

    var kind = "new";
    if(prev !== null){
      if(vol > prevVol){ kind="up"; improved++; }
      else if(vol < prevVol){ kind="down"; declined++; }
      else { kind="flat"; same++; }
    } else { newCount++; }

    results.push({exId:exId, name:ex.name, kind:kind, vol:vol, prevVol:prevVol});

    // --- streak / weight-increase logic ---
    // Criterion: both "greutate maximă" sets (index 2,3) at same weight, reps >= threshold,
    // two sessions in a row at that same weight => flag. A higher weight than last time resets the streak.
    var m1 = entry.sets[2], m2 = entry.sets[3];
    var w1 = parseFloat(m1.weight), w2 = parseFloat(m2.weight), r1 = parseFloat(m1.reps), r2 = parseFloat(m2.reps);
    if(isFinite(w1) && isFinite(w2) && isFinite(r1) && isFinite(r2) && w1===w2){
      var st = state.streaks[exId] || {lastWeight:null, streak:0, flagged:false};
      var hit = r1 >= settings.repsThreshold && r2 >= settings.repsThreshold;
      if(st.lastWeight===null || w1 > st.lastWeight){
        st = {lastWeight:w1, streak: hit?1:0, flagged:false};
      } else if(w1 === st.lastWeight){
        st.streak = hit ? st.streak+1 : 0;
        var wasFlagged = st.flagged;
        st.flagged = st.streak >= settings.consecutiveRequired;
        if(st.flagged && !wasFlagged) newFlags.push({exId:exId, name:ex.name});
      } else {
        st = {lastWeight:w1, streak: hit?1:0, flagged:false};
      }
      state.streaks[exId] = st;
    }
  });

  var durationMin = Math.max(0, Math.round((Date.now() - new Date(draft.date).getTime())/60000));
  state.sessions.push({id:sessionId, dayId:draft.dayId, date:draft.date, entries:draft.entries, durationMin:durationMin});
  state.draft = null;
  touch();
  saveState();

  return {dayName:d.name, results:results, subs:subs, improved:improved, same:same, declined:declined, newCount:newCount, newFlags:newFlags, durationMin:durationMin};
}

function fmtDuration(min){
  if(min<1) return "sub 1 min";
  if(min<60) return min+" min";
  var h = Math.floor(min/60), m = min%60;
  return h+"h"+(m ? " "+m+"min" : "");
}

function renderSummary(){
  var s = lastSummary;
  var html = '<div class="eyebrow">Antrenament finalizat</div><h1 class="page-title">'+s.dayName+'</h1>';

  function exWord(n, formComparabil){
    var ex = n===1 ? "exercițiu" : "exerciții";
    if(!formComparabil) return ex;
    return ex + " " + (n===1 ? "comparabil" : "comparabile");
  }

  var paragraph;
  var comparable = s.improved+s.same+s.declined;
  var total = comparable+s.newCount;
  if(comparable===0){
    paragraph = s.newCount>0
      ? "Primul tău antrenament înregistrat pentru ziua asta ("+s.newCount+" "+exWord(s.newCount)+" noi). De acum încolo îți arăt progresul față de fiecare sesiune anterioară."
      : "Nu am nimic de comparat încă.";
  } else if(s.improved >= s.declined && s.improved>0){
    paragraph = "Progres bun: volumul a crescut la "+s.improved+" din "+comparable+" "+exWord(comparable, true)+". Continuă în același ritm și ai grijă la exercițiile rămase neschimbate.";
  } else if(s.declined > s.improved){
    paragraph = "Antrenament sub nivelul anterior la "+s.declined+" din "+comparable+" "+exWord(comparable)+". Poate fi oboseală, somn sau recuperare — nu schimba greutățile, doar concentrează-te pe execuție data viitoare.";
  } else {
    paragraph = "Antrenament stabil, fără schimbări majore de volum la "+comparable+" "+exWord(comparable, true)+". Solid, dar caută un mic progres data viitoare — un rep în plus e suficient.";
  }

  html += '<div class="summary-hero"><div class="duration-badge">⏱ '+fmtDuration(s.durationMin)+'</div><p>'+paragraph+'</p><div class="summary-stats">'

    });
  }

  if(s.results.length){

        var sign = diff>0 ? "+" : "";
        evHtml = '<span class="'+(diff<0?'neg':'')+'"><b>'+sign+Math.round(diff)+'</b> vol.</span>';
      }
      html += '<div class="delta-row"><div class="en">'+r.name+'</div><div class="ev num">'+evHtml+'</div></div>';
    });
    html += '</div>';
  }

  if(s.subs.length){

    s.subs.forEach(function(sub){
      html += '<div class="sub-row"><div class="en">'+sub.name+'</div><div class="ev">→ '+sub.text+'</div></div>';
    });
    html += '</div>';
  }

  html += '<div class="backup-banner"><div><strong>Salvează acest antrenament</strong><br>Datele stau doar pe acest telefon. Exportă un backup acum, cât sunt proaspete.</div>'
    +'<button class="btn btn-primary" onclick="App.exportData()">Exportă</button></div>';
  html += '<div class="btn-row"><button class="btn btn-primary btn-block" onclick="App.goHome()">Înapoi acasă</button></div>';
  return html;
}

    });
  });
  html += '</div>';
  return html;
}

function collectDailyValues(field, startDaysAgo, endDaysAgo){
  var vals = [];
  for(var i=endDaysAgo; i<=startDaysAgo; i++){
    var d = new Date(); d.setDate(d.getDate()-i);
    var log = state.dailyLogs[dateKey(d)];
    if(log && log[field]!==""){
      var v = parseFloat(log[field]);
      if(isFinite(v)) vals.push(v);
    }
  }
  return vals;
}
function avg(arr){ return arr.reduce(function(a,b){ return a+b; },0)/arr.length; }

function analyzeSuggestions(){
  var real = state.sessions.filter(function(s){ return !s.skipped; });
  var skips = state.sessions.filter(function(s){ return s.skipped; });
  var insights = [];

  var last7Sleep = collectDailyValues("sleepHours",6,0);
  var last7Protein = collectDailyValues("protein",6,0);
  var last7Weight = collectDailyValues("weight",6,0);
  var prev7Weight = collectDailyValues("weight",13,7);
  var avgSleep = last7Sleep.length>=3 ? avg(last7Sleep) : null;
  var avgProtein = last7Protein.length>=3 ? avg(last7Protein) : null;
  var avgWeightRecent = last7Weight.length>=3 ? avg(last7Weight) : null;
  var proteinPerKg = (avgProtein!==null && avgWeightRecent!==null) ? avgProtein/avgWeightRecent : null;

  var cutoff = new Date(Date.now() - 14*24*3600*1000);
  var recentReal = real.filter(function(s){ return new Date(s.date) >= cutoff; });
  var recentSkip = skips.filter(function(s){ return new Date(s.date) >= cutoff; });
  var recentText = "Ai antrenat de "+recentReal.length+" "+(recentReal.length===1?"dată":"ori")
    +(recentSkip.length ? " și ai sărit de "+recentSkip.length+" "+(recentSkip.length===1?"dată":"ori") : "")
    +". Programul tău are 4 zile pe săptămână, adică ~8 antrenamente în 2 săptămâni."
    +(recentReal.length < 5 ? " Ești sub ritmul planificat — încearcă să prinzi zilele rămase cât mai curând." : " Ritm solid, continuă așa.");
  insights.push({type:"info", title:"Consistență, ultimele 14 zile", text: recentText});

  var flagged = Object.keys(state.streaks).filter(function(id){ return state.streaks[id] && state.streaks[id].flagged && EXERCISES[id]; });
  if(flagged.length){
    insights.push({type:"action", title:"Gata de crescut greutatea", text: flagged.map(function(id){ return EXERCISES[id].name; }).join(", ")+"."});
  }

  if(avgSleep!==null){
    insights.push({type: avgSleep<7 ? "warn":"info", title:"Somn, ultimele 7 zile", text:
      "Ai dormit în medie "+avgSleep.toFixed(1)+" ore pe noapte."
      +(avgSleep<7 ? " Sub pragul uzual de 7-9 ore recomandat pentru recuperare — poate merită mai devreme la somn." : " În intervalul recomandat pentru recuperare.")});
  }

  if(proteinPerKg!==null){
    insights.push({type: proteinPerKg<1.6 ? "warn":"info", title:"Proteină față de greutate", text:
      "Ai mâncat în medie "+Math.round(avgProtein)+"g proteină/zi, la o greutate medie de "+avgWeightRecent.toFixed(1)+"kg (~"+proteinPerKg.toFixed(1)+"g/kg)."
      +(proteinPerKg<1.6 ? " Sub recomandarea uzuală de 1.6-2.2g/kg pentru cineva activ la sală." : " În intervalul recomandat pentru cineva activ la sală.")});
  }

  if(last7Weight.length>=3 && prev7Weight.length>=3){
    var wDiff = avg(last7Weight) - avg(prev7Weight);
    var wText;
    if(Math.abs(wDiff) < 0.2) wText = "Greutatea ta a fost stabilă în ultimele 7 zile ("+avg(last7Weight).toFixed(1)+"kg în medie).";
    else wText = "Greutatea ta a "+(wDiff>0?"crescut":"scăzut")+" cu ~"+Math.abs(wDiff).toFixed(1)+"kg față de săptămâna anterioară ("+avg(last7Weight).toFixed(1)+"kg în medie acum).";
    insights.push({type:"info", title:"Greutate, ultimele 7 zile", text: wText});
  }

  var byExercise = {};
  real.forEach(function(s){
    Object.keys(s.entries).forEach(function(exId){
      var e = s.entries[exId], ex = EXERCISES[exId];
      if(!ex || !ex.hasSets || e.substituted) return;
      var filled = e.sets.some(function(st){ return st.weight!=="" && st.reps!==""; });
      if(!filled) return;
      var vol = e.sets.reduce(function(sum,st){ var w=parseFloat(st.weight), r=parseFloat(st.reps); return sum+(isFinite(w)&&isFinite(r)?w*r:0); },0);
      (byExercise[exId] = byExercise[exId]||[]).push({date:s.date, vol:vol});
    });
  });
  // Stagnation streak = how many most-recent sessions in a row failed to beat the
  // one before them (0 if the last session was itself a new high). This is more
  // precise than a fixed "last 3" window and lets us tell generalized fatigue
  // (many exercises stuck at once) apart from one lift needing a tweak.
  var STAG_FLAG = 3, STAG_DELOAD = 5, GENERALIZED_COUNT = 3;
  var stagList = [];
  Object.keys(byExercise).forEach(function(exId){
    var arr = byExercise[exId].sort(function(a,b){ return new Date(a.date)-new Date(b.date); });
    if(arr.length<2) return;
    var streak = 0;
    for(var i=arr.length-1;i>0;i--){
      if(arr[i].vol > arr[i-1].vol) break;
      streak++;
    }
    if(streak >= STAG_FLAG) stagList.push({exId:exId, name:EXERCISES[exId].name, streak:streak});
  });
  stagList.sort(function(a,b){ return b.streak-a.streak; });

  if(stagList.length){
    var causes = [];
    if(avgSleep!==null && avgSleep<7) causes.push("dormi în medie doar "+avgSleep.toFixed(1)+"h/noapte");
    if(proteinPerKg!==null && proteinPerKg<1.6) causes.push("iei doar ~"+proteinPerKg.toFixed(1)+"g proteină/kg");
    var causeText = causes.length ? " Posibil legat și de recuperare: "+causes.join(" și ")+"." : "";

    var generalized = stagList.length >= GENERALIZED_COUNT;
    var anyDeload = stagList.some(function(s){ return s.streak>=STAG_DELOAD; });
    var title, text;
    var listWithStreaks = stagList.map(function(s){ return s.name+" ("+s.streak+")"; }).join(", ");

    if(generalized && anyDeload){
      title = "Stagnare generalizată — ia în calcul un deload";
      text = stagList.length+" exerciții nu au mai progresat de mai multe antrenamente: "+listWithStreaks+". "
        +"Când stagnarea apare simultan pe mai multe exerciții, de obicei nu e o problemă de tehnică izolată, ci semn de recuperare insuficientă. "
        +"Ia în calcul o săptămână de deload (aceleași exerciții, dar cu ~10-20% mai puțină greutate sau un set în minus), apoi reia progresia."+causeText;
    } else if(generalized){
      var minStreak = stagList[stagList.length-1].streak, maxStreak = stagList[0].streak;
      var rangeText = minStreak===maxStreak ? maxStreak+" antrenamente" : minStreak+"-"+maxStreak+" antrenamente";
      title = "Mai multe exerciții încep să stagneze";
      text = stagList.length+" exerciții nu au mai crescut de "+rangeText+": "+listWithStreaks+". "
        +"Încă nu e cazul de deload, dar ține sub observație — dacă tendința continuă câteva antrenamente, ia în calcul o săptămână mai ușoară."+causeText;
    } else if(anyDeload){
      var deloadOnes = stagList.filter(function(s){ return s.streak>=STAG_DELOAD; });
      title = "Stagnare izolată, de durată";
      text = deloadOnes.map(function(s){ return s.name+" ("+s.streak+" antrenamente)"; }).join(", ")
        +" nu mai progresează de o vreme, dar restul antrenamentului arată bine — probabil nu e vorba de recuperare generală. "
        +"Încearcă ceva punctual: schimbă ordinea în antrenament (fă-l primul, cât ești odihnit), tempo-ul, sau intervalul de repetări.";
    } else {
      title = "Exerciții fără progres recent";
      text = stagList.map(function(s){ return s.name; }).join(", ")+" nu au mai crescut în volum de "+stagList[0].streak+" antrenamente."
        +(causeText || " Verifică odihna și somnul, sau încearcă un rep în plus data viitoare.");
    }
    insights.push({type:"warn", title:title, text:text});
  }

  var subCount = {};
  real.forEach(function(s){
    Object.keys(s.entries).forEach(function(exId){
      var e = s.entries[exId];
      if(e && e.substituted) subCount[exId] = (subCount[exId]||0)+1;
    });
  });
  var freqSub = Object.keys(subCount).filter(function(exId){ return subCount[exId]>=3; });
  if(freqSub.length){
    insights.push({type:"warn", title:"Aparate frecvent ocupate", text: freqSub.map(function(exId){ return EXERCISES[exId].name+" ("+subCount[exId]+" înlocuiri)"; }).join(", ")+". Dacă se tot repetă, poate merită schimbată ora sau ordinea de antrenament."});
  }

  var skipCount = {};
  skips.forEach(function(s){ skipCount[s.dayId] = (skipCount[s.dayId]||0)+1; });
  var worstDay = Object.keys(skipCount).sort(function(a,b){ return skipCount[b]-skipCount[a]; })[0];
  if(worstDay && skipCount[worstDay]>=2){
    insights.push({type:"warn", title:"Zi sărită des", text: dayById[worstDay].name+" a fost sărită de "+skipCount[worstDay]+" ori. Poate ar trebui mutată în altă zi a săptămânii."});
  }

  return insights;
}

function renderSuggestions(){
  var html = renderTopbar();
  html += '<div class="eyebrow">Analiză</div><h1 class="page-title">Sugestii</h1>';
  var real = state.sessions.filter(function(s){ return !s.skipped; });
  var loggedDays = Object.keys(state.dailyLogs).filter(function(dk){ var l=state.dailyLogs[dk]; return l.weight||l.sleepHours||l.protein; }).length;
  if(real.length < 3 && loggedDays < 3){
    html += '<div class="empty-state">Ai nevoie de cel puțin 3 antrenamente sau 3 zile cu date de corp (greutate/somn/proteină) înregistrate ca să pot genera sugestii utile.</div>';
    return html;
  }
  var insights = analyzeSuggestions();
  html += '<div style="margin-top:14px;">';
  insights.forEach(function(ins){
    var icon = ins.type==="action" ? "🔼" : ins.type==="warn" ? "⚠️" : "📊";
    var cls = "insight-card"+(ins.type==="warn"?" warn":ins.type==="action"?" action":"");
    html += '<div class="'+cls+'"><div class="t">'+icon+' '+ins.title+'</div><div class="d">'+ins.text+'</div></div>';
  });
  html += '</div>';
  return html;
}

    : 'La zi — ultimul backup a fost '+(backupDays===0?'azi':'acum '+backupDays+' '+(backupDays===1?'zi':'zile'))+'.';

  html += '<div class="linkrow"><button class="btn btn-primary" onclick="App.exportData()">Exportă backup</button>'
    +'<label class="btn filebtn" for="importFile">Importă backup</label><input type="file" id="importFile" accept="application/json" onchange="App.importData(this.files[0])"></div></div>';

  return html;

function renderTabbar(){
  function tab(id, icon, label){
    var active = (view===id) || (id==="history" && view==="history");
    return '<button class="'+(active?"active":"")+'" onclick="App.setView(\''+id+'\')"><span class="ic">'+icon+'</span>'+label+'</button>';
  }
  return '<div class="tabbar">'+tab("home","🏠","Acasă")+tab("daily","⚖️","Corp")+tab("history","📖","Istoric")+tab("suggestions","💡","Sugestii")+tab("settings","⚙️","Setări")+'</div>';
}

var lastScrollKey = null;
function render(){
  var app = document.getElementById("app");
  var html = "";
  if(view==="home") html = renderHome();
  else if(view==="session") html = renderSession();
  else if(view==="summary") html = renderSummary();
  else if(view==="daily") html = renderDaily();
  else if(view==="history") html = renderHistory();
  else if(view==="suggestions") html = renderSuggestions();
  else if(view==="settings") html = renderSettings();
  app.innerHTML = html;
  if(view==="home" || view==="daily" || view==="history" || view==="suggestions" || view==="settings"){
    app.innerHTML += renderTabbar();
  }
  // Only jump to top when the logical page actually changed — re-rendering the same
  // page after an in-place edit (e.g. leaving an input field) must not move the scroll,
  // or it steals focus from whatever the user tapped next.
  var scrollKey = view+":"+(historyDetailId||"");
  if(scrollKey !== lastScrollKey) window.scrollTo(0,0);
  lastScrollKey = scrollKey;
}

var App = {
  startDay: startDay,
  skipDay: function(dayId){
    var d = dayById[dayId];
    askConfirm("Notezi că ai sărit peste "+d.name+" din săptămâna "+weekLabel(weekStart(new Date()))+"?", function(){
      state.sessions.push({id:"skip_"+Date.now(), dayId:dayId, date: todayIso(), entries:{}, skipped:true});
      touch();
      saveState();
      render();
    });
  },
  resume: function(){ view="session"; render(); },
  setView: function(v){ historyDetailId=null; view=v; render(); },
  goHome: function(){ view="home"; render(); },
  validateWeightSleep: function(){
    var k = dateKey(new Date());
    if(!state.dailyLogs[k]) state.dailyLogs[k] = emptyDailyLog();
    var wEl = document.getElementById("dailyWeightInput");
    var sEl = document.getElementById("dailySleepInput");
    state.dailyLogs[k].weight = normalizeDecimal(wEl ? wEl.value : "");
    state.dailyLogs[k].sleepHours = sEl ? sEl.value : "";
    touch(); saveState(); render();
  },
  validateProtein: function(){
    var k = dateKey(new Date());
    if(!state.dailyLogs[k]) state.dailyLogs[k] = emptyDailyLog();
    var pEl = document.getElementById("dailyProteinInput");
    state.dailyLogs[k].protein = normalizeDecimal(pEl ? pEl.value : "");
    touch(); saveState(); render();
  },
  updateSet: function(exId, idx, field, val){
    // No render() here on purpose: rebuilding the page while a field loses focus
    // (moving to the next box) destroys the very input the user just tapped into.
    // The exercise card's progress color only needs to catch up on the next real
    // navigation (toggling a card, finishing the workout, switching tabs).
    state.draft.entries[exId].sets[idx][field] = val;
    saveState();
  },
  updateDone: function(exId, checked){
    state.draft.entries[exId].done = checked;
    saveState(); render();
  },
  toggleSub: function(exId){
    var e = state.draft.entries[exId];
    e.substituted = !e.substituted;
    saveState(); render();
  },
  updateSub: function(exId, val){
    state.draft.entries[exId].substituteText = val;
    saveState();
  },
  pickReserve: function(exId, name){
    state.draft.entries[exId].substituteText = name;
    saveState(); render();
  },
  confirmAbandon: function(){
    askConfirm("Renunți la acest antrenament? Datele introduse se pierd.", function(){
      state.draft = null; saveState(); view="home"; render();
    });
  },
  modalConfirm: function(){
    var cb = modal && modal.onConfirm;
    modal = null; renderModalRoot();
    if(cb) cb();
  },
  modalCancel: function(){
    modal = null; renderModalRoot();
  },
  finish: function(){
    askConfirm("Ești sigur că vrei să finalizezi antrenamentul?", function(){
      lastSummary = computeSummaryAndSave();
      view = "summary";
      render();
    });
  },
  openHistory: function(id){ historyDetailId=id; render(); },
  closeHistory: function(){ historyDetailId=null; render(); },
  deleteSession: function(id){
    askConfirm("Ștergi definitiv acest antrenament din istoric?", function(){
      state.sessions = state.sessions.filter(function(s){ return s.id!==id; });
      touch();
      saveState();
      historyDetailId = null;
      render();
    });
  },
  updateSetting: function(key, val){
    var n = parseInt(val,10);
    if(isFinite(n) && n>0) state.settings[key] = n;
    saveState(); render();
  },
  setTheme: function(t){
    state.settings.theme = t;
    saveState(); applyTheme(); render();
  },
  exportData: function(){
    var json = JSON.stringify(state, null, 2);
    var filename = "jurnal-antrenament-backup-"+new Date().toISOString().slice(0,10)+".json";
    function markSaved(){ state.settings.lastBackupAt = todayIso(); saveState(); render(); }
    function downloadBlob(){
      var blob = new Blob([json], {type:"application/octet-stream"});
      var url = URL.createObjectURL(blob);
      var a = document.createElement("a");
      a.href = url; a.download = filename;
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      URL.revokeObjectURL(url);
      markSaved();
    }
    if(window.claude && window.claude.downloads){
      window.claude.downloads.save({filename:filename, data:json}).then(markSaved).catch(function(err){
        showAlert("Backup-ul nu s-a salvat: "+(err && err.message ? err.message : "încearcă din nou"));
      });
      return;
    }
    // Plain <a download> links are unreliable for JSON on iOS Safari — they can silently
    // display the content instead of saving a file. The native share sheet (with an explicit
    // "Save to Files" option) is the reliable path on iOS; fall back to a forced download elsewhere.
    var file = new File([json], filename, {type:"application/json"});
    if(navigator.canShare && navigator.canShare({files:[file]})){
      navigator.share({files:[file], title:filename}).then(markSaved).catch(function(err){
        if(err && err.name==="AbortError") return;
        downloadBlob();
      });
    } else {
      downloadBlob();
    }
  },
  importData: function(file){
    if(!file) return;
    var reader = new FileReader();
    reader.onload = function(){
      try{
        var parsed = JSON.parse(reader.result);
        if(!parsed || !Array.isArray(parsed.sessions)) throw new Error("format invalid");
        askConfirm("Importul suprascrie toate datele curente. Continui?", function(){
          state = Object.assign(defaultState(), parsed);
          saveState();
          view = "home"; render();
        });
      }catch(e){ showAlert("Fișier invalid: "+e.message); }
    };
    reader.readAsText(file);
  }
};
window.App = App;

render();
})();
</script>
