<style>
:root{
  --paper:#F0EEE7;
  --surface:#FFFFFF;
  --ink:#1B1D21;
  --ink-muted:#63676F;
  --ink-faint:#9A9C9F;
  --line:#DBD8CE;
  --accent:#3E6E91;
  --accent-ink:#FFFFFF;
  --success:#4F8F5E;
  --success-bg:#E5F0E6;
  --warning:#C97A2B;
  --warning-bg:#F7E9D6;
  --danger:#B8503D;
  --danger-bg:#F6E1DC;
  --stripe-idle:#C9C6BB;
  --font-display:-apple-system,"Helvetica Neue",Helvetica,Arial,sans-serif;
  --font-body:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --font-mono:ui-monospace,"SF Mono","Roboto Mono","Cascadia Mono",Menlo,Consolas,monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root{
    --paper:#14161A;
    --surface:#1D2025;
    --ink:#ECEAE3;
    --ink-muted:#9A9CA3;
    --ink-faint:#6B6E74;
    --line:#2C2F35;
    --accent:#6FA8CC;
    --accent-ink:#0E1013;
    --success:#6FBE81;
    --success-bg:#1E2A20;
    --warning:#E1974C;
    --warning-bg:#33270F;
    --danger:#E07862;
    --danger-bg:#331E19;
    --stripe-idle:#3A3D43;
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --paper:#14161A;--surface:#1D2025;--ink:#ECEAE3;--ink-muted:#9A9CA3;--ink-faint:#6B6E74;
  --line:#2C2F35;--accent:#6FA8CC;--accent-ink:#0E1013;--success:#6FBE81;--success-bg:#1E2A20;
  --warning:#E1974C;--warning-bg:#33270F;--danger:#E07862;--danger-bg:#331E19;--stripe-idle:#3A3D43;
  color-scheme: dark;
}
:root[data-theme="light"]{
  --paper:#F0EEE7;--surface:#FFFFFF;--ink:#1B1D21;--ink-muted:#63676F;--ink-faint:#9A9C9F;
  --line:#DBD8CE;--accent:#3E6E91;--accent-ink:#FFFFFF;--success:#4F8F5E;--success-bg:#E5F0E6;
  --warning:#C97A2B;--warning-bg:#F7E9D6;--danger:#B8503D;--danger-bg:#F6E1DC;--stripe-idle:#C9C6BB;
  color-scheme: light;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--paper);
  color:var(--ink);
  font-family:var(--font-body);
  font-size:16px;
  line-height:1.45;
  -webkit-font-smoothing:antialiased;
  overscroll-behavior-y:none;
}
#app{
  max-width:560px;
  margin:0 auto;
  padding:20px 16px 96px;
  min-height:100vh;
}
h1,h2,h3{font-family:var(--font-display);text-wrap:balance;margin:0;}
.eyebrow{
  font-family:var(--font-mono);
  font-size:11px;
  letter-spacing:.11em;
  text-transform:uppercase;
  color:var(--ink-faint);
}
.page-title{
  font-size:26px;
  font-weight:800;
  letter-spacing:-0.01em;
  margin-top:2px;
}
.subtitle{color:var(--ink-muted);font-size:14.5px;margin-top:4px;}
.num{font-family:var(--font-mono);font-variant-numeric:tabular-nums;}
/* ---- top bar ---- */
.topbar{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:18px;}
.brand{font-family:var(--font-display);font-weight:900;letter-spacing:.02em;font-size:15px;}
